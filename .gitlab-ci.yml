image: python:3.13

stages:
  - test
  - build
  - deploy

default:
  tags:
    - gwas

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

.python:
  before_script:
    - pip install --upgrade pip
    - pip install uv
    - uv sync --group dev --frozen

.docker:
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

test:
  extends: .python
  stage: test
  script:
    - uv run pytest -v

test_worker:
  image: node:24-alpine
  stage: test
  script:
    - node tests/test_py_worker.mjs

build:
  extends: .docker
  stage: build
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - docker build --network=host --cache-from "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "dev"'

build_release:
  extends: .docker
  stage: build
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - docker build --network=host --cache-from "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

# Build every branch and tag; publish manually from the default branch or a tag.
build_pages:
  stage: build
  before_script:
    - pip install uv
  script:
    - sh deployment/build_pages.sh
  artifacts:
    paths:
      - public/

publish_pages:
  stage: deploy
  needs:
    - job: test
      artifacts: false
    - job: test_worker
      artifacts: false
    - job: build_pages
      artifacts: true
  script:
    # CI_PAGES_URL handles both group paths and unique project domains.
    - |
      python - <<'PYTHON'
      import os
      from pathlib import Path
      from urllib.parse import urlsplit

      base = urlsplit(os.environ["CI_PAGES_URL"]).path.rstrip("/")
      Path("public/_redirects").write_text(
          f"{base}/docs/* {base}/docs/index.html 200\n"
      )
      PYTHON
  pages:
    publish: public
    expire_in: never
  resource_group: pages-production
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
