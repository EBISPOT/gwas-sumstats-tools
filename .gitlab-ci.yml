image: python:3.13

stages:
  - test
  - build
  - deploy

default:
  tags:
    - gwas

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

.python:
  before_script:
    - pip install --upgrade pip
    - pip install uv
    - uv sync --group dev --frozen

.docker:
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

.helm:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/dtzar/helm-kubectl:2.13.1
  stage: deploy
  before_script:
    - mkdir -p /root/.kube

test:
  extends: .python
  stage: test
  script:
    - uv run pytest -v

build:
  extends: .docker
  stage: build
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - docker build --network=host --cache-from "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev"'

build_release:
  extends: .docker
  stage: build
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - docker build --network=host --cache-from "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

build_docs:
  extends: .docker
  stage: build
  variables:
    BUILDKIT_OCI_MEDIA_TYPES: "0"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:docs-latest" || true
    - >
      docker build
      --network=host
      --cache-from "$CI_REGISTRY_IMAGE:docs-latest"
      --platform linux/amd64
      --provenance=false
      -f Dockerfile.docs
      -t "$CI_REGISTRY_IMAGE:docs-$CI_COMMIT_SHA"
      .
    - docker push "$CI_REGISTRY_IMAGE:docs-$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev"'

build_release_docs:
  extends: .docker
  stage: build
  variables:
    BUILDKIT_OCI_MEDIA_TYPES: "0"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:docs-latest" || true
    - >
      docker build
      --network=host
      --cache-from "$CI_REGISTRY_IMAGE:docs-latest"
      --platform linux/amd64
      --provenance=false
      -f Dockerfile.docs
      -t "$CI_REGISTRY_IMAGE:docs-$CI_COMMIT_SHA"
      .
    - docker push "$CI_REGISTRY_IMAGE:docs-$CI_COMMIT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE:docs-$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:docs-latest"
    - docker tag "$CI_REGISTRY_IMAGE:docs-$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:docs-$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:docs-latest"
    - docker push "$CI_REGISTRY_IMAGE:docs-$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

deploy_dev:
  extends: .helm
  script:
    - echo "$PLIVE_KUBECONFIG" | base64 -d > /root/.kube/config
    - helm init --stable-repo-url https://charts.helm.sh/stable
    - helm delete --purge gwas-sumstats-tools-dev || true
    - >
      helm install --name gwas-sumstats-tools-dev
      --set k8Namespace=gwas-dev,image.repository=$CI_REGISTRY_IMAGE,image.tag=docs-$CI_COMMIT_SHA
      deployment/helm/
      --wait
  environment:
    name: dev
  needs: [build_docs]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy:
  extends: .helm
  script:
    - echo "$PLIVE_KUBECONFIG" | base64 -d > /root/.kube/config
    - helm init --stable-repo-url https://charts.helm.sh/stable
    - helm delete --purge gwas-sumstats-tools || true
    - >
      helm install --name gwas-sumstats-tools
      --set k8Namespace=gwas,image.repository=$CI_REGISTRY_IMAGE,image.tag=docs-$CI_COMMIT_TAG
      deployment/helm/
      --wait
  environment:
    name: production
  when: manual
  needs: [build_release_docs]
  rules:
    - if: $CI_COMMIT_TAG

deploy_fallback:
  extends: .helm
  script:
    - echo "$PFALLBACK_KUBECONFIG" | base64 -d > /root/.kube/config
    - helm init --stable-repo-url https://charts.helm.sh/stable
    - helm delete --purge gwas-sumstats-tools || true
    - >
      helm install --name gwas-sumstats-tools
      --set k8Namespace=gwas,image.repository=$CI_REGISTRY_IMAGE,image.tag=docs-$CI_COMMIT_TAG
      deployment/helm/
      --wait
  environment:
    name: fallback
  when: manual
  needs: [build_release_docs]
  rules:
    - if: $CI_COMMIT_TAG
