image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.13

stages:
  - test
  - build
  - deploy

default:
  tags:
    - gwas

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

.python:
  before_script:
    - pip install --upgrade pip
    - pip install uv
    - uv sync --group dev --frozen

test:
  extends: .python
  stage: test
  script:
    - uv run pytest -v

test_worker:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:24-alpine
  stage: test
  script:
    - node tests/test_py_worker.mjs

# Build every branch and tag for production and development Pages deployments.
build_pages:
  stage: build
  before_script:
    - pip install uv
  script:
    - sh deployment/build_pages.sh
  artifacts:
    paths:
      - public/

.publish_pages:
  stage: deploy
  needs:
    - job: test
      artifacts: false
    - job: test_worker
      artifacts: false
    - job: build_pages
      artifacts: true
  script:
    # CI_PAGES_URL includes the deployment prefix (GitLab 17.9+).
    - |
      python - <<'PYTHON'
      import os
      from pathlib import Path
      from urllib.parse import urlsplit

      base = urlsplit(os.environ["CI_PAGES_URL"]).path.rstrip("/")
      Path("public/_redirects").write_text(
          f"{base}/docs/* {base}/docs/index.html 200\n"
      )
      PYTHON
  pages:
    publish: public
    expire_in: never

publish_pages:
  extends: .publish_pages
  resource_group: pages-production
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

publish_pages_dev:
  extends: .publish_pages
  pages:
    path_prefix: dev
  resource_group: pages-dev
  environment:
    name: dev
    deployment_tier: development
    url: $CI_PAGES_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_COMMIT_REF_PROTECTED == "true"'
