image: "python:3.9"

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  CI_REGISTRY_IMAGE: ebispot/gwas-sumstats-tools
  CI_DOCS_IMAGE: ebispot/gwas-sumstats-tools-docs


.before_script_template:
  before_script:
    - pip install --upgrade pip
    - pip install poetry
    - poetry install

test:
  extends: .before_script_template
  stage: test
  script:
    - poetry run pytest -v

build:
  image: docker:latest
  services:
    - docker:dind
  stage: build
  script:
   - echo "$DOCKER_HUB_PASSWORD" > dhpw.txt
   - docker login -u "${DOCKER_HUB_USER}" --password-stdin < dhpw.txt docker.io
   - docker pull $CI_REGISTRY_IMAGE:latest || true
   - docker build --network=host --cache-from $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
   - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  tags:
    - gwas
  only:
    - master
    - dev

build_release:
  image: docker:latest
  services:
    - docker:dind
  variables:
    GIT_STRATEGY: none
  stage: build
  script:
   - echo "$DOCKER_HUB_PASSWORD" > dhpw.txt
   - docker login -u "${DOCKER_HUB_USER}" --password-stdin < dhpw.txt
   - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
   - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
   - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
   - docker push $CI_REGISTRY_IMAGE:latest
   - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  tags:
    - gwas
  only:
    - tags

build-docs:
  image: docker:latest
  services:
    - docker:dind
  stage: build
  variables:
    BUILDKIT_OCI_MEDIA_TYPES: "0"
  script:
   - echo "$DOCKER_HUB_PASSWORD" > dhpw.txt
   - docker login -u "${DOCKER_HUB_USER}" --password-stdin < dhpw.txt docker.io
   - docker pull $CI_DOCS_IMAGE:latest || true
   - docker build --network=host
       --cache-from $CI_DOCS_IMAGE:latest
       --platform linux/amd64
       --provenance=false
       -f Dockerfile.docs
       -t $CI_DOCS_IMAGE:$CI_COMMIT_SHA
       .
   - docker push $CI_DOCS_IMAGE:$CI_COMMIT_SHA
  tags:
    - gwas
  only:
    - master
    - dev

build_release-docs:
  image: docker:latest
  services:
    - docker:dind
  variables:
    GIT_STRATEGY: none
  stage: build
  script:
   - echo "$DOCKER_HUB_PASSWORD" > dhpw.txt
   - docker login -u "${DOCKER_HUB_USER}" --password-stdin < dhpw.txt
   - docker pull $CI_DOCS_IMAGE:$CI_COMMIT_SHA
   - docker tag $CI_DOCS_IMAGE:$CI_COMMIT_SHA $CI_DOCS_IMAGE:latest
   - docker tag $CI_DOCS_IMAGE:$CI_COMMIT_SHA $CI_DOCS_IMAGE:$CI_COMMIT_TAG
   - docker push $CI_DOCS_IMAGE:latest
   - docker push $CI_DOCS_IMAGE:$CI_COMMIT_TAG
  tags:
    - gwas
  only:
    - tags

deploy-dev:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/dtzar/helm-kubectl:2.13.1
  stage: deploy
  variables:
    GIT_STRATEGY: none
  script:
    - mkdir -p /root/.kube
    - echo ${PLIVE_KUBECONFIG} | base64 -d > /root/.kube/config
    - helm init --stable-repo-url https://charts.helm.sh/stable
    - helm delete --purge gwas-sumstats-tools-dev || true
    - helm install --name gwas-sumstats-tools-dev
        --set k8Namespace=gwas-dev,image.repository=$CI_DOCS_IMAGE,image.tag=$CI_COMMIT_SHA
        deployment/helm/ --wait
  environment:
    name: dev
  tags:
    - gwas
  only:
    - dev
  needs:
    - build-docs

deploy:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/dtzar/helm-kubectl:2.13.1
  stage: deploy
  variables:
    GIT_STRATEGY: none
  script:
    - mkdir -p /root/.kube
    - echo ${PLIVE_KUBECONFIG} | base64 -d > /root/.kube/config
    - helm init --stable-repo-url https://charts.helm.sh/stable
    - helm delete --purge gwas-sumstats-tools || true
    - helm install --name gwas-sumstats-tools
        --set k8Namespace=gwas,image.repository=$CI_DOCS_IMAGE,image.tag=$CI_COMMIT_TAG
        deployment/helm/ --wait
  environment:
    name: production
  tags:
    - gwas
  only:
    - tags
  needs:
    - build_release-docs

deploy-fallback:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/dtzar/helm-kubectl:2.13.1
  stage: deploy
  variables:
    GIT_STRATEGY: none
  script:
    - mkdir -p /root/.kube
    - echo ${PFALLBACK_KUBECONFIG} | base64 -d > /root/.kube/config
    - helm init --stable-repo-url https://charts.helm.sh/stable
    - helm delete --purge gwas-sumstats-tools || true
    - helm install --name gwas-sumstats-tools
        --set k8Namespace=gwas,image.repository=$CI_DOCS_IMAGE,image.tag=$CI_COMMIT_TAG
        deployment/helm/ --wait
  environment:
    name: fallback
  when: manual
  tags:
    - gwas
  only:
    - tags
  needs:
    - build_release-docs

