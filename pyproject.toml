[project]
name = "gwas-sumstats-tools"
version = "2.0.0"
description = ""
authors = [
    {name = "jdhayhurst", email = "jhayhurst@ebi.ac.uk"},
    {name = "yueji", email = "jiyue1214@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "petl>=1.7.12,<2",
    "requests>=2.28.2,<3",
    "pyyaml>=6.0,<7",
    "pydantic>=2.0,<3",
    "typer>=0.9.0,<1",
    "pandera>=0.17,<1",
    "pandas>=2.1,<3",
    "numpy>=2.0,<3",
    "ruamel-yaml>=0.17.32,<1",
    "bsub>=0.3.5,<1",
]

[project.scripts]
gwas-ssf = "gwas_sumstats_tools.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0,<5",
    "pytest>=7.2.1,<8",
    "hypothesis>=6.68.2,<7",
    "pytest-mock>=3.10.0,<4",
    "ruff>=0.8.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwas_sumstats_tools"]
