name: Test Pages Site

on:
  pull_request:
    paths:
      - 'docs/gwas-sumstats-tools-doc/**'
      - 'apps/ssf-morph/**'
      - 'src/**'
      - 'tests/test_py_worker.mjs'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'deployment/build_pages.sh'
      - '.gitlab-ci.yml'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - name: Build and check Pages site
        run: sh deployment/build_pages.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check worker startup and buffer transfers
        run: node tests/test_py_worker.mjs
