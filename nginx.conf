server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects as path-only so the port is preserved when running behind
    # a non-standard port (e.g. docker run -p 8000:80)
    absolute_redirect off;

    # Redirect bare root to the site base path
    location = / {
        return 301 /gwas/apps/gwas-sumstats-tools/;
    }

    # Serve ssf-morph (the main landing page)
    location /gwas/apps/gwas-sumstats-tools/ {
        try_files $uri $uri/ $uri.html /gwas/apps/gwas-sumstats-tools/index.html;
    }

    # Serve documentation (docsify with SPA routing)
    location /gwas/apps/gwas-sumstats-tools/docs/ {
        try_files $uri $uri/ /gwas/apps/gwas-sumstats-tools/docs/index.html;
    }

    # Cache static assets for 1 week
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Don't log favicon requests
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
